name: Node.js Package

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # use Volta to manage yarn/node versions
      - uses: volta-cli/action@v4

      # OIDC publishing requires npm >= 11.5.1. Keep Node/Yarn on the repo pins.
      - name: Set up npm for Trusted Publishing
        run: volta install npm@11.19.0

      - run: yarn install --immutable && yarn bootstrap:prepare
        env:
          HUSKY: 0
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true

      - name: Check workspace and bundle releases
        run: yarn release:check

      - name: Publish
        run: npm publish --workspaces --access public --tag latest
