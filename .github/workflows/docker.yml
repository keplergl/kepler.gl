# Prod image smoke test (env-only /config.json). Skipped unless docker packaging changes.
name: Docker CI

on:
  push:
    branches: [master]
    paths:
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kepler-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose file
        run: |
          printf 'MapboxAccessToken=pk.ci-test\nKEPLER_PAGE_TITLE=ci-title\n' > .env
          docker compose -f docker/docker-compose.yml --env-file .env config >/dev/null

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          provenance: false
          sbom: false
          tags: kepler-prod:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test runtime config
        run: |
          docker run -d --name kepler-prod -p 8080:8080 \
            -e KEPLER_MAPBOX_ACCESS_TOKEN=pk.ci-test \
            -e KEPLER_PAGE_TITLE=ci-title \
            kepler-prod:ci

          cleanup() { docker logs kepler-prod || true; docker rm -f kepler-prod || true; }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/config.json >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8080/config.json > /tmp/kepler-config.json
          python3 -c 'import json; c=json.load(open("/tmp/kepler-config.json")); assert c["credentials"]["MapboxAccessToken"]=="pk.ci-test", c; assert c["pageTitle"]=="ci-title", c'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
