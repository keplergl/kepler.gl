name: npm Manual Publisher

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in package.json
        type: string
        required: true
      publish:
        description: Publish the checked workspace and bundle tarballs to npm
        type: boolean
        default: false

permissions:
  contents: read

# Do not cancel an upload halfway through when another run is requested.
concurrency:
  group: npm-manual-publisher
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Validate publish selection
        if: inputs.publish
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" || "$GITHUB_REPOSITORY" != "keplergl/kepler.gl" ]]; then
            echo "Publishing is only allowed from master in keplergl/kepler.gl."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: volta-cli/action@v4

      - name: Set up Node and npm
        run: |
          volta install "node@$(node -p 'require("./package.json").volta.node')"
          volta install npm@11.19.0

      - run: yarn install --immutable && yarn bootstrap:prepare
        env:
          HUSKY: 0
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true

      - name: Check and pack workspaces and bundle
        run: node scripts/publish-release.js prepare "$RELEASE_VERSION" "$RUNNER_TEMP/npm-release"
        env:
          HUSKY: 0

      - name: Save checked tarballs for publishing and retries
        id: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-release
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false

  publish:
    needs: prepare
    if: inputs.publish && github.ref == 'refs/heads/master' && github.repository == 'keplergl/kepler.gl'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: volta-cli/action@v4

      - name: Set up Node and npm
        run: |
          volta install "node@$(node -p 'require("./package.json").volta.node')"
          volta install npm@11.19.0

      # An empty artifact-ids input would otherwise download every artifact.
      - name: Require the original artifact ID
        env:
          RELEASE_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact-id }}
        run: |
          if [[ ! "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The original release artifact ID is missing or invalid; refusing to publish."
            exit 1
          fi

      - name: Download the original checked tarballs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true

      # The legacy workflow has a release trigger and no shared concurrency group.
      # Check immediately before publishing; never change its state automatically.
      - name: Require the legacy publisher to be disabled and idle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          legacy="repos/$GITHUB_REPOSITORY/actions/workflows/npmpublish.yml"
          state=$(gh api "$legacy" --jq '.state')
          if [[ "$state" != "disabled_manually" ]]; then
            echo "Disable the Node.js Package workflow in GitHub Actions before publishing here."
            exit 1
          fi
          for status in queued in_progress waiting pending requested; do
            active=$(gh api "$legacy/runs?status=$status&per_page=1" --jq '.total_count')
            if [[ "$active" != "0" ]]; then
              echo "The legacy publisher has $status runs. Wait for or cancel them before retrying."
              exit 1
            fi
          done

      - name: Publish missing workspaces and bundle
        run: node scripts/publish-release.js publish "$RELEASE_VERSION" "$RUNNER_TEMP/npm-release"
